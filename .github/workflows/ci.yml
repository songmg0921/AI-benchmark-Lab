name: Test, Build and Publish Docker image
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
env:
  IMAGE_NAME: ai-benchmark-lab
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" .
      - name: Container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name "${IMAGE_NAME}-smoke" -p 18000:8000 "${IMAGE_NAME}:${GITHUB_SHA}"
          trap 'docker logs "${IMAGE_NAME}-smoke" || true; docker rm -f "${IMAGE_NAME}-smoke" || true' EXIT
          for attempt in {1..30}; do curl --fail --silent http://127.0.0.1:18000/api/health && exit 0 || sleep 1; done
          exit 1
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
