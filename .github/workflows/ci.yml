# AI Benchmark Lab CI/CD workflow
name: Test, Build and Publish Docker image
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
env:
  IMAGE_NAME: ai-benchmark-lab
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build --tag "${{ env.IMAGE_NAME }}:${{ github.sha }}" .
      - name: Run container smoke test
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name "${IMAGE_NAME}-smoke" --publish 18000:8000 "${IMAGE_NAME}:${GITHUB_SHA}"
          trap 'docker logs "${IMAGE_NAME}-smoke" || true; docker rm --force "${IMAGE_NAME}-smoke" || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18000/api/health; then exit 0; fi
            sleep 1
          done
          exit 1

  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and normalize Docker Hub credentials
        id: dockerhub
        shell: bash
        run: |
          set -euo pipefail
          username="${DOCKERHUB_USERNAME//[[:space:]]/}"
          if [[ -z "$username" ]]; then
            echo "DOCKERHUB_USERNAME secret is not configured for this repository." >&2
            exit 1
          fi
          username="${username,,}"
          if [[ ! "$username" =~ ^[a-z0-9][a-z0-9_.-]*$ ]]; then
            echo "DOCKERHUB_USERNAME is not a valid Docker Hub namespace after normalization." >&2
            exit 1
          fi
          if [[ -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "DOCKERHUB_TOKEN secret is not configured for this repository." >&2
            exit 1
          fi
          echo "username=$username" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dockerhub.outputs.username }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy latest image to Windows runner
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: publish
    runs-on: [self-hosted, Windows, X64]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ai-benchmark-lab
      CONTAINER_NAME: ai-benchmark-lab
      HOST_PORT: "8000"
    steps:
      - name: Check out monitoring script
        uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull and replace local container
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $username = $env:DOCKERHUB_USERNAME.Trim().ToLowerInvariant()
          if ([string]::IsNullOrWhiteSpace($username)) { throw 'DOCKERHUB_USERNAME is empty.' }
          $image = '{0}/{1}:latest' -f $username, $env:IMAGE_NAME
          $container = $env:CONTAINER_NAME
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE 'deployment-artifacts'
          New-Item -ItemType Directory -Force $artifactDir | Out-Null
          $monitorLog = Join-Path $artifactDir 'service-monitor.jsonl'
          $phasePath = Join-Path $artifactDir 'phase.txt'
          Set-Content -Path $phasePath -Value 'pre' -Encoding UTF8
          $monitor = $null

          try {
            $monitor = Start-Process powershell -ArgumentList @('-NoProfile','-ExecutionPolicy','Bypass','-File',"$env:GITHUB_WORKSPACE\scripts\monitor-service.ps1",'-Url',"http://127.0.0.1:$($env:HOST_PORT)/api/health",'-DurationSeconds','120','-IntervalSeconds','1','-LogPath',$monitorLog,'-PhasePath',$phasePath) -PassThru
            Start-Sleep -Seconds 5
            $pulled = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              docker pull $image
              if ($LASTEXITCODE -eq 0) { $pulled = $true; break }
              Start-Sleep -Seconds 5
            }
            if (-not $pulled) { throw "Docker pull failed after 3 attempts: $image" }

            Set-Content -Path $phasePath -Value 'deploying' -Encoding UTF8
            # The existing container owns the published host port, so replace it first.
            docker rm -f $container 2>$null
            docker run --detach --name $container --publish "${env:HOST_PORT}:8000" --env "APP_VERSION=${env:GITHUB_SHA}" --restart unless-stopped $image
            if ($LASTEXITCODE -ne 0) { throw 'Failed to start replacement container.' }

            $healthy = $false
            for ($attempt = 1; $attempt -le 30; $attempt++) {
              try {
                $response = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:$($env:HOST_PORT)/api/health" -TimeoutSec 3
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
              Start-Sleep -Seconds 2
            }
            if (-not $healthy) { throw 'Replacement container did not pass /api/health.' }

            Set-Content -Path $phasePath -Value 'post' -Encoding UTF8
            Start-Sleep -Seconds 30
            Write-Host "Deployed $image as $container"
          } catch {
            Write-Host 'Deployment failed. Container diagnostics:'
            docker ps -a --filter "name=$container"
            docker logs $container 2>$null
            throw
          } finally {
            if ($monitor -and -not $monitor.HasExited) { Stop-Process -Id $monitor.Id -Force }
          }

      - name: Write deployment summary
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command "& '{0}'"
        run: |
          $log = Join-Path $env:GITHUB_WORKSPACE 'deployment-artifacts\service-monitor.jsonl'
          if (Test-Path $log) {
            $rows = @(Get-Content $log -Encoding UTF8 | ForEach-Object { $_ | ConvertFrom-Json })
            $ok = @($rows | Where-Object { $_.analysisOk -eq $true }).Count
            $failed = $rows.Count - $ok
            $gaps = @(); for($i=1;$i -lt $rows.Count;$i++){ $gaps += ([datetime]$rows[$i].start-[datetime]$rows[$i-1].end).TotalSeconds }
            $maxGap = if ($gaps.Count) { [math]::Round(($gaps | Measure-Object -Maximum).Maximum,2) } else { 'N/A' }
            $versions = @($rows | Where-Object { $_.version } | Select-Object -ExpandProperty version -Unique) -join ' -> '
            $intervals = if ($gaps.Count) { [math]::Round(($rows.Count / ([datetime]$rows[-1].end - [datetime]$rows[0].start).TotalSeconds),2) } else { 'N/A' }
            $continuity = if ($failed -eq 0 -and $maxGap -ne 'N/A' -and [double]$maxGap -le 3) { 'PASS - no failed response observed; no unobserved gap over 3 seconds' } else { 'INCONCLUSIVE/FAIL - inspect failed responses or unobserved gaps' }
            $summary = @()
            $summary += '## Deployment monitoring and zero-downtime evidence'
            $summary += ''
            $summary += "- Verification URL: http://127.0.0.1:$env:HOST_PORT/api/health"
            $summary += "- Observation window: $($rows[0].start) to $($rows[-1].end) (UTC)"
            $summary += "- Requests: $($rows.Count) | Success: $ok | Failure: $failed"
            $summary += "- Observed request rate: $intervals requests/second | Maximum unobserved gap: $maxGap seconds"
            $summary += "- Version transition observed: $versions"
            $summary += "- Observed continuity result: $continuity"
            $summary += ''
            $summary += '| Phase | Requests | Success | Failure | Representative response |'
            $summary += '|---|---:|---:|---:|---|'
            foreach($phase in @('pre','deploying','post')) { $part=@($rows|Where-Object{$_.phase -eq $phase}); $pOk=@($part|Where-Object{$_.analysisOk -eq $true}).Count; $rep=if($part.Count){"$($part[0].status) / $($part[0].responseMs) ms / $($part[0].version)"}else{'not observed'}; $summary += "| $phase | $($part.Count) | $pOk | $($part.Count-$pOk) | $rep |" }
            $summary += ''
            $summary += 'A zero-downtime claim applies only to this observed request window. Any unobserved gap is explicitly reported above.'
            $summary += ''
            $summary += 'Raw UTF-8 log: `deployment-artifacts/service-monitor.jsonl`'
            $summary -join "`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
          } else { '## Deployment monitoring`n`nMonitoring log was not created.' >> $env:GITHUB_STEP_SUMMARY }

      - name: Upload deployment logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-monitor-${{ github.run_id }}
          path: deployment-artifacts/
          if-no-files-found: warn
